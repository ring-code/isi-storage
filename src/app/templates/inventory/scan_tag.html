{% extends "base.html" %}

{% block title %}Scan QR Code{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <h2 class="text-center mb-4">Scan Asset Tag</h2>
        
        <div class="card">
            <div class="card-body">
                
                <div id="qr-reader" style="width: 100%;"></div>
                
                <div id="qr-reader-results" class="mt-3"></div>

                <div class="text-center mt-3">
                    <button id="start-scan-btn" class="btn btn-primary">Start Camera Scan</button>
                    <button id="stop-scan-btn" class="btn btn-danger" style="display: none;">Stop Scanning</button>
                </div>
                
                <hr>
                
                <div class="text-center text-muted">
                    <p>Alternatively, you can search manually:</p>
                    <a href="{{ url_for('main.find_unit') }}" class="btn btn-secondary">Search by Serial Number</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/html5_qrcode.min.js') }}"></script>
    
    <script src="{{ url_for('static', filename='js/qr_scanner.js') }}"></script>

    <script>
        // This makes the lookup_url from your route available to qr_scanner.js
        const ISI_SCANNER_CONFIG = {
            lookupUrl: "{{ lookup_url }}"
        };
    </script>
{% endblock %}
